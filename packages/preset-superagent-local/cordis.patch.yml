- insert:
    - id: superagent-local-runtime
      name: dsh-preset-superagent-local
    - id: preset-superagent-local
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: superagent-local
        name: SuperAgent模式
        description: 用自然语言提问或交办 Git 项目任务，自动委派、追踪和回传结果。
        order: 20
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: 你正在 DeepSeek Harness 的 SuperAgent模式中协助用户。
          - id: superagent-router
            name: dsh-preset-superagent-local/router
          - id: superagent-worker
            name: dsh-preset-superagent-local/worker
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: shell
            name: cordis:group
            group: true
            isolate: { shell: true }
            config:
              - id: bash-sandbox
                name: '@deepseek-ai/dsh-bash-sandbox'
                disabled: !!js process.platform === 'win32'
                config: { timeoutMs: 5000, maxTimeoutMs: 5000 }
              - id: pwsh-sandbox
                name: '@deepseek-ai/dsh-pwsh-sandbox'
                disabled: !!js process.platform !== 'win32'
                config: { timeoutMs: 5000, maxTimeoutMs: 5000 }
              - id: tool-bash
                name: '@deepseek-ai/dsh-tool-bash'
                disabled: !!js process.platform === 'win32'
              - id: tool-pwsh
                name: '@deepseek-ai/dsh-tool-pwsh'
                disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config: { sampleOverCapGlobResults: false }
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
            config: { waitTimeoutMs: 5000, maxWaitTimeoutMs: 5000 }
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config: { allowParallelInProgress: true }
          - id: compaction
            name: cordis:group
            group: true
            isolate: { compaction: true, toolResultPruner: true }
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config: { thresholdChars: 8192, headChars: 4096, tailChars: 1024 }
